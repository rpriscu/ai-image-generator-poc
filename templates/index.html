<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .image-container {
            min-height: 300px;
            background-color: #f8f9fa;
            border: 2px dashed #dee2e6;
            border-radius: 8px;
            padding: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 1rem;
            position: relative;
        }

        #generatedImage {
            max-width: 100%;
            max-height: 600px;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 4px;
            display: none;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        #result:not(.hidden) #generatedImage {
            display: block;
        }

        .loading {
            opacity: 0.7;
            cursor: not-allowed;
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        #result {
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }

        #result:not(.hidden) {
            opacity: 1;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-4xl font-bold text-center mb-8 text-gray-800">AI Image Generator</h1>
        
        <div class="max-w-2xl mx-auto bg-white rounded-lg shadow-md p-6">
            <form id="generateForm" class="space-y-4">
                <div>
                    <label for="prompt" class="block text-sm font-medium text-gray-700">Prompt</label>
                    <textarea id="prompt" name="prompt" rows="3" 
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500"
                        placeholder="Describe the image you want to generate..." required></textarea>
                </div>

                <div>
                    <label for="model" class="block text-sm font-medium text-gray-700">Model</label>
                    <select id="model" name="model" 
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" required>
                        {% for model_id, model in models.items() %}
                        <option value="{{ model_id }}">{{ model.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div id="imageUploadContainer" class="hidden">
                    <label for="image" class="block text-sm font-medium text-gray-700">Reference Image</label>
                    <input type="file" id="image" name="image" accept="image/*"
                        class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
                </div>

                <button type="submit" 
                    class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                    Generate Image
                </button>
            </form>

            <div id="result" class="mt-8 hidden">
                <h2 class="text-xl font-semibold mb-4">Generated Image</h2>
                <div class="image-container">
                    <img id="generatedImage" alt="Generated image">
                </div>
            </div>

            <div id="error" class="mt-4 hidden">
                <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative" role="alert">
                    <span class="block sm:inline" id="errorMessage"></span>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('generateForm');
            const modelSelect = document.getElementById('model');
            const imageUploadContainer = document.getElementById('imageUploadContainer');
            const resultContainer = document.getElementById('result');
            const generatedImage = document.getElementById('generatedImage');
            const errorContainer = document.getElementById('error');
            const errorMessage = document.getElementById('errorMessage');

            // Show/hide image upload based on model type
            modelSelect.addEventListener('change', function() {
                const selectedModel = this.value;
                const isImageToImage = selectedModel === 'stable_diffusion' || selectedModel === 'kolors';
                imageUploadContainer.classList.toggle('hidden', !isImageToImage);
            });

            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                // Show loading state
                const button = form.querySelector('button[type="submit"]');
                const originalButtonText = button.textContent;
                button.textContent = 'Generating...';
                button.disabled = true;

                const resultContainer = document.getElementById('result');
                const errorContainer = document.getElementById('error');
                const errorMessage = document.getElementById('errorMessage');
                const generatedImage = document.getElementById('generatedImage');
                
                try {
                    const formData = new FormData(form);
                    const response = await fetch('/api/generate', {
                        method: 'POST',
                        body: formData
                    });

                    const data = await response.json();
                    console.log('API Response:', data);

                    if (!response.ok) {
                        throw new Error(data.error || 'Failed to generate image');
                    }

                    if (!data.image_url) {
                        throw new Error('No image URL in response');
                    }

                    // Clear previous image
                    generatedImage.src = '';
                    
                    // Set up image loading
                    generatedImage.onload = function() {
                        resultContainer.classList.remove('hidden');
                        errorContainer.classList.add('hidden');
                        generatedImage.style.display = 'block';
                    };

                    generatedImage.onerror = function() {
                        throw new Error('Failed to load the generated image');
                    };

                    // Set the new image URL
                    generatedImage.src = data.image_url;

                } catch (error) {
                    console.error('Error:', error);
                    errorMessage.textContent = error.message;
                    errorContainer.classList.remove('hidden');
                    resultContainer.classList.add('hidden');
                } finally {
                    // Reset button state
                    button.textContent = originalButtonText;
                    button.disabled = false;
                }
            });
        });
    </script>
</body>
</html>
