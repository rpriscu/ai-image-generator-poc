<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zemingo AI Image Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <div class="logo-container">
            <div class="logo">
                <img src="{{ url_for('static', filename='images/ZemingoLogo.png') }}" alt="Zemingo Logo" class="logo-img">
            </div>
            <div class="app-title">Advanced Image Generator</div>
        </div>
        <div class="beta-badge">Beta</div>
    </header>

    <main>
        <div class="prompt-container">
            <div class="input-wrapper">
                <input type="text" id="prompt" name="prompt" placeholder="Enter your prompt" required>
            </div>
            <div class="controls">
                <div class="model-select">
                    <select id="model" name="model" required>
                        {% for model_id, model in models.items() %}
                        <option value="{{ model_id }}" data-type="{{ model.type }}" data-description="{{ model.description }}" {% if model_id == 'flux' %}selected{% endif %}>{{ model.name }}</option>
                        {% endfor %}
                    </select>
                    <div class="select-arrow"></div>
                </div>
                <button id="generateBtn" class="generate-btn">Generate</button>
            </div>
            <div id="imageUploadContainer" class="upload-container hidden">
                <label for="image" class="upload-label">Upload Reference Image</label>
                <input type="file" id="image" name="image" accept="image/*">
            </div>
            <p id="modelDescription" class="model-description"></p>
        </div>

        <div class="loading-indicator hidden">
            <div class="spinner"></div>
            <p>Generating images...</p>
        </div>

        <div id="errorContainer" class="error-container hidden">
            <p id="errorMessage"></p>
        </div>

        <div class="images-grid">
            <div class="image-card" id="imageCard1">
                <div class="image-placeholder">
                    <div class="placeholder-effect hidden"></div>
                    <img id="generatedImage1" class="hidden" alt="Generated image 1">
                    <button class="download-btn hidden" data-index="0">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                            <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="image-card" id="imageCard2">
                <div class="image-placeholder">
                    <div class="placeholder-effect hidden"></div>
                    <img id="generatedImage2" class="hidden" alt="Generated image 2">
                    <button class="download-btn hidden" data-index="1">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                            <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="image-card" id="imageCard3">
                <div class="image-placeholder">
                    <div class="placeholder-effect hidden"></div>
                    <img id="generatedImage3" class="hidden" alt="Generated image 3">
                    <button class="download-btn hidden" data-index="2">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                            <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="image-card" id="imageCard4">
                <div class="image-placeholder">
                    <div class="placeholder-effect hidden"></div>
                    <img id="generatedImage4" class="hidden" alt="Generated image 4">
                    <button class="download-btn hidden" data-index="3">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                            <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const promptInput = document.getElementById('prompt');
            const modelSelect = document.getElementById('model');
            const generateBtn = document.getElementById('generateBtn');
            const imageUploadContainer = document.getElementById('imageUploadContainer');
            const modelDescription = document.getElementById('modelDescription');
            const errorContainer = document.getElementById('errorContainer');
            const errorMessage = document.getElementById('errorMessage');
            const loadingIndicator = document.querySelector('.loading-indicator');
            
            // Image elements
            const imageElements = [
                document.getElementById('generatedImage1'),
                document.getElementById('generatedImage2'),
                document.getElementById('generatedImage3'),
                document.getElementById('generatedImage4')
            ];
            
            // Placeholder effects
            const placeholderEffects = document.querySelectorAll('.placeholder-effect');
            
            // Download buttons
            const downloadButtons = document.querySelectorAll('.download-btn');
            
            // Track generated image URLs
            let generatedImageUrls = [];

            // Trigger change event on model select to initialize UI based on selected model
            modelSelect.dispatchEvent(new Event('change'));

            // Show/hide image upload based on model type
            modelSelect.addEventListener('change', function() {
                const selectedOption = this.options[this.selectedIndex];
                const modelType = selectedOption.dataset.type;
                const description = selectedOption.dataset.description;
                
                // Show description if available
                modelDescription.textContent = description || '';
                
                // Show image upload for image-to-image and hybrid models
                imageUploadContainer.classList.toggle('hidden', modelType === 'text-to-image');
                
                // Update file input required state
                const imageInput = document.getElementById('image');
                imageInput.required = modelType === 'image-to-image';
            });
            
            // Handle download button clicks
            downloadButtons.forEach(button => {
                button.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const index = parseInt(this.getAttribute('data-index'));
                    if (generatedImageUrls[index]) {
                        downloadImage(generatedImageUrls[index], `generated-image-${index + 1}.png`);
                    }
                });
            });
            
            // Function to download an image
            function downloadImage(url, filename) {
                fetch(url)
                    .then(response => response.blob())
                    .then(blob => {
                        const link = document.createElement('a');
                        link.href = URL.createObjectURL(blob);
                        link.download = filename;
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                    })
                    .catch(error => {
                        console.error('Error downloading image:', error);
                    });
            }

            // Handle form submission
            generateBtn.addEventListener('click', async function() {
                if (!promptInput.value.trim()) {
                    errorMessage.textContent = "Please enter a prompt";
                    errorContainer.classList.remove('hidden');
                    return;
                }

                if (!modelSelect.value) {
                    errorMessage.textContent = "Please select a model";
                    errorContainer.classList.remove('hidden');
                    return;
                }

                const imageInput = document.getElementById('image');
                const selectedOption = modelSelect.options[modelSelect.selectedIndex];
                const modelType = selectedOption.dataset.type;
                
                if ((modelType === 'image-to-image' || modelType === 'hybrid') && 
                    imageInput.required && !imageInput.files.length) {
                    errorMessage.textContent = "Please upload a reference image";
                    errorContainer.classList.remove('hidden');
                    return;
                }

                // Hide error if any
                errorContainer.classList.add('hidden');
                
                // Reset previous images
                imageElements.forEach(img => {
                    img.classList.add('hidden');
                    img.src = '';
                });
                
                // Hide download buttons
                downloadButtons.forEach(btn => btn.classList.add('hidden'));
                
                // Show loading effects
                placeholderEffects.forEach(effect => effect.classList.remove('hidden'));
                
                // Hide main loading indicator and disable generate button
                loadingIndicator.classList.add('hidden');
                generateBtn.disabled = true;
                
                // Reset generated image URLs
                generatedImageUrls = [];
                
                try {
                    const formData = new FormData();
                    formData.append('prompt', promptInput.value);
                    formData.append('model', modelSelect.value);
                    formData.append('num_images', '4');  // Request 4 images
                    
                    if (imageInput.files.length > 0) {
                        formData.append('image', imageInput.files[0]);
                    }
                    
                    const response = await fetch('/api/generate', {
                        method: 'POST',
                        body: formData
                    });

                    const data = await response.json();
                    
                    if (!response.ok) {
                        throw new Error(data.error || 'Failed to generate image');
                    }

                    if (!data.image_urls || data.image_urls.length === 0) {
                        throw new Error('No images received from the server');
                    }

                    // Store generated image URLs
                    generatedImageUrls = data.image_urls;
                    
                    // Display the received images in the grid
                    imageElements.forEach((img, index) => {
                        if (index < generatedImageUrls.length) {
                            img.src = generatedImageUrls[index];
                            img.onload = function() {
                                // Hide placeholder effect for this image
                                placeholderEffects[index].classList.add('hidden');
                                // Show the image and download button
                                img.classList.remove('hidden');
                                downloadButtons[index].classList.remove('hidden');
                                img.parentElement.classList.add('loaded');
                            };
                            img.onerror = function() {
                                // Hide placeholder effect if image fails to load
                                placeholderEffects[index].classList.add('hidden');
                                console.error('Failed to load image');
                            };
                        }
                    });

                } catch (error) {
                    console.error('Error:', error);
                    errorMessage.textContent = error.message;
                    errorContainer.classList.remove('hidden');
                    
                    // Hide all placeholder effects
                    placeholderEffects.forEach(effect => effect.classList.add('hidden'));
                } finally {
                    // Enable generate button
                    generateBtn.disabled = false;
                }
            });
        });
    </script>
</body>
</html>
